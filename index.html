<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch api</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container-fluid">
        <div class="container">
            <h1>Crud with JavaScript fetch api</h1>
        </div>
    </div>
    <div class="container">
        <div class="card">
            <div class="card-body">
                <h3>Students (44)</h3>
                <button class="btn btn-primary" id="create">Create</button>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Country</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <!--<tr>
                        <td>Id</td>
                        <td>Name</td>
                        <td>Age</td>
                        <td>Country</td>
                        <td><button class="btn btn-success" id="edit">Edit</button></td>
                        <td><button class="btn btn-danger">Delete</button></td>
                    </tr>-->
                </tbody>
            </table>
        </div>
    </div>

    <!-- create student modal -->
    
    <div class="modal" id="create-student">
        <div class="modal-body">
            <h2>Create student</h2>
            <div class="form-group">
                <label for=""><b>Enter your name</b></label>
                <input type="text" placeholder="Enter your name" id="name" class="form-control"/>
            </div>
            <div class="form-group">
                <label for=""><b>Enter your age</b></label>
                <input type="text" placeholder="Enter your age" id="age" class="form-control"/>
            </div>
            <div class="form-group">
                <label for=""><b>Enter your country</b></label>
                <input type="text" placeholder="Enter your country" id="country" class="form-control"/>
            </div>
            <div class="form-group buttons">
                <button class="btn btn-success" type="submit" id="save">Save</button>
                <button class="btn btn-danger" type="submit" id="close">Close</button>
            </div>
        </div>
    </div>

    <div class="modal" id="update-student">
        <div class="modal-body">
            <h2>Update student</h2>
            <div class="form-group">
                <label for=""><b>Enter your name</b></label>
                <input type="text" placeholder="Enter your name" id="edit_name" class="form-control"/>
                <input type="text" placeholder="Id" id="id" class="form-control"/>
            </div>
            <div class="form-group">
                <label for=""><b>Enter your age</b></label>
                <input type="text" placeholder="Enter your age" id="edit_age" class="form-control"/>
            </div>
            <div class="form-group">
                <label for=""><b>Enter your country</b></label>
                <input type="text" placeholder="Enter your country" id="edit_country" class="form-control"/>
            </div>
            <div class="form-group buttons">
                <button class="btn btn-success" type="submit" id="update">Update</button>
                <button class="btn btn-danger" type="submit" id="update-close">Close</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
